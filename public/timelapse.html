<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mirror Timelapse</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;500;700&family=Barlow:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #000;
      --surface: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.08);
      --text: rgba(255,255,255,0.85);
      --dim: rgba(255,255,255,0.35);
      --faint: rgba(255,255,255,0.15);
      --accent: #4fc3f7;
      --font-cond: 'Barlow Condensed', sans-serif;
      --font-ui: 'Barlow', sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
    }

    /* ── Layout ── */
    #app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100dvh;          /* dynamic viewport height — handles mobile browser chrome */
      width: 100vw;
      max-width: 100vw;
      padding: 12px 16px;
      gap: 10px;
      overflow: hidden;
    }

    /* ── Header ── */
    header { display:flex; align-items:baseline; justify-content:space-between; flex-shrink:0; min-width:0; }
    h1 { font-family:var(--font-cond); font-size:26px; font-weight:700; letter-spacing:-1px; white-space:nowrap; }
    #counter { font-family:var(--font-cond); font-size:14px; color:var(--dim); letter-spacing:2px; white-space:nowrap; }

    /* ── Main photo ── */
    #photo-wrap {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;           /* critical — lets grid row shrink */
      min-width: 0;
      width: 100%;
    }
    #main-img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      transition: opacity 0.15s ease;
    }
    #main-img.fade { opacity: 0; }

    /* Date overlay */
    #date-overlay {
      position:absolute;
      bottom:16px; left:16px;
      background:rgba(0,0,0,0.6);
      backdrop-filter:blur(8px);
      border-radius:6px;
      padding:6px 14px;
      font-family:var(--font-cond);
      font-size:18px;
      letter-spacing:3px;
      text-transform:uppercase;
      color:var(--text);
    }

    /* Photo number badge */
    #photo-num {
      position:absolute;
      top:16px; right:16px;
      background:rgba(0,0,0,0.5);
      border-radius:6px;
      padding:4px 12px;
      font-family:var(--font-cond);
      font-size:15px;
      letter-spacing:2px;
      color:var(--dim);
    }

    /* Nav arrows */
    .nav-btn {
      position:absolute;
      top:50%; transform:translateY(-50%);
      width:48px; height:72px;
      background:rgba(0,0,0,0.4);
      border:1px solid var(--border);
      border-radius:8px;
      color:var(--text);
      font-size:24px;
      cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:background 0.2s;
      z-index:10;
    }
    .nav-btn:hover { background:rgba(255,255,255,0.1); }
    #btn-prev { left:12px; }
    #btn-next { right:12px; }

    /* Loading / empty state */
    #loading {
      position:absolute;
      font-family:var(--font-cond);
      font-size:18px;
      letter-spacing:4px;
      color:var(--faint);
      text-transform:uppercase;
    }

    /* ── Controls bar ── */
    #controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      min-width: 0;
      width: 100%;
    }

    /* Filmstrip */
    #filmstrip {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      flex-shrink: 0;
      height: 60px;
      width: 100%;
      max-width: 100%;
    }
    .thumb {
      flex: 0 0 48px;
      height: 52px;
      border-radius: 4px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      transition: border-color 0.2s, opacity 0.2s;
      opacity: 0.5;
      background: var(--surface);
      flex-shrink: 0;
    }
    .thumb.active { border-color:var(--accent); opacity:1; }
    .thumb:hover { opacity:0.85; }
    .thumb img { width:100%; height:100%; object-fit:cover; display:block; }

    /* Playback controls */
    #playbar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex-wrap: nowrap;
    }
    .ctrl-btn {
      font-family: var(--font-cond);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.08); }
    .ctrl-btn.active { border-color: var(--accent); color: var(--accent); }

    #speed-label {
      font-family: var(--font-cond);
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--dim);
      white-space: nowrap;
      flex-shrink: 0;
    }
    #speed-slider {
      flex: 1;
      min-width: 40px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    #fps-display {
      font-family: var(--font-cond);
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 1px;
      min-width: 44px;
      text-align: right;
      flex-shrink: 0;
    }

    /* Progress bar */
    #progress-wrap {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      width: 100%;
    }
    #progress-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.1s linear;
      width: 0%;
    }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      #app { padding: 8px 10px; gap: 8px; }
      h1 { font-size: 20px; }
      .ctrl-btn { padding: 7px 10px; font-size: 11px; letter-spacing: 1px; }
      #speed-label { display: none; }
      .nav-btn { width: 36px; height: 52px; font-size: 18px; }
      #filmstrip { height: 52px; }
      .thumb { flex: 0 0 40px; height: 44px; }
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>Timelapse</h1>
    <div id="counter">Loading...</div>
  </header>

  <div id="photo-wrap">
    <div id="loading">Loading photos...</div>
    <img id="main-img" src="" alt="" style="display:none" />
    <div id="date-overlay" style="display:none"></div>
    <div id="photo-num" style="display:none"></div>
    <button class="nav-btn" id="btn-prev">‹</button>
    <button class="nav-btn" id="btn-next">›</button>
  </div>

  <div id="controls">
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <div id="filmstrip"></div>
    <div id="playbar">
      <button class="ctrl-btn" id="btn-play">▶ Play</button>
      <button class="ctrl-btn" id="btn-restart">↺ Restart</button>
      <span id="speed-label">Speed</span>
      <input id="speed-slider" type="range" min="1" max="10" value="3" />
      <span id="fps-display">3 fps</span>
    </div>
  </div>
</div>

<script>
let photos    = [];
let current   = 0;
let playing   = false;
let playTimer = null;
let fps       = 3;

// ── Fetch all photos via mirror server proxy (avoids CORS) ───────────────
async function loadPhotos() {
  try {
    const res  = await fetch('/api/timelapse/photos');
    const data = await res.json();
    photos = (data.photos || []).map(p => ({
      id:   p.id,
      date: new Date(p.date),
      url:  p.url,
    }));

    document.getElementById('loading').style.display = 'none';
    document.getElementById('main-img').style.display = 'block';
    document.getElementById('date-overlay').style.display = 'block';
    document.getElementById('photo-num').style.display = 'block';
    document.getElementById('counter').textContent = `${photos.length} PHOTOS`;

    buildFilmstrip();
    showPhoto(0);
  } catch (err) {
    document.getElementById('loading').textContent = 'Failed to load — check Immich key';
    console.error(err);
  }
}

// ── Filmstrip ────────────────────────────────────────────────────────────
function buildFilmstrip() {
  const strip = document.getElementById('filmstrip');
  strip.innerHTML = '';
  photos.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.dataset.idx = i;
    const img = document.createElement('img');
    img.src = p.url;
    img.loading = 'lazy';
    div.appendChild(img);
    div.addEventListener('click', () => { stopPlay(); showPhoto(i); });
    strip.appendChild(div);
  });
}

function updateFilmstrip(idx) {
  document.querySelectorAll('.thumb').forEach((t, i) => {
    t.classList.toggle('active', i === idx);
  });
  // Scroll active thumb into view
  const active = document.querySelector('.thumb.active');
  if (active) active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

// ── Show photo ────────────────────────────────────────────────────────────
function showPhoto(idx) {
  if (!photos.length) return;
  idx = Math.max(0, Math.min(photos.length - 1, idx));
  current = idx;

  const img     = document.getElementById('main-img');
  const dateEl  = document.getElementById('date-overlay');
  const numEl   = document.getElementById('photo-num');
  const barEl   = document.getElementById('progress-bar');
  const p       = photos[idx];

  img.classList.add('fade');
  setTimeout(() => {
    img.src = p.url;
    img.onload = () => img.classList.remove('fade');
    img.onerror = () => img.classList.remove('fade');
  }, 100);

  dateEl.textContent = p.date.toLocaleDateString('en-US', {
    weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
  }).toUpperCase();

  numEl.textContent = `${idx + 1} / ${photos.length}`;
  barEl.style.width = `${((idx + 1) / photos.length) * 100}%`;
  updateFilmstrip(idx);
}

// ── Playback ──────────────────────────────────────────────────────────────
function startPlay() {
  if (!photos.length) return;
  playing = true;
  document.getElementById('btn-play').textContent  = '⏸ Pause';
  document.getElementById('btn-play').classList.add('active');
  tick();
}

function stopPlay() {
  playing = false;
  clearTimeout(playTimer);
  document.getElementById('btn-play').textContent = '▶ Play';
  document.getElementById('btn-play').classList.remove('active');
}

function tick() {
  if (!playing) return;
  if (current >= photos.length - 1) {
    stopPlay();
    return;
  }
  showPhoto(current + 1);
  playTimer = setTimeout(tick, 1000 / fps);
}

// ── Controls ──────────────────────────────────────────────────────────────
document.getElementById('btn-play').addEventListener('click', () => {
  playing ? stopPlay() : startPlay();
});

document.getElementById('btn-restart').addEventListener('click', () => {
  stopPlay();
  showPhoto(0);
});

document.getElementById('btn-prev').addEventListener('click', () => {
  stopPlay(); showPhoto(current - 1);
});

document.getElementById('btn-next').addEventListener('click', () => {
  stopPlay(); showPhoto(current + 1);
});

document.getElementById('speed-slider').addEventListener('input', function() {
  fps = parseInt(this.value);
  document.getElementById('fps-display').textContent = `${fps} fps`;
});

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  { stopPlay(); showPhoto(current - 1); }
  if (e.key === 'ArrowRight') { stopPlay(); showPhoto(current + 1); }
  if (e.key === ' ')          { playing ? stopPlay() : startPlay(); e.preventDefault(); }
  if (e.key === 'Home')       { stopPlay(); showPhoto(0); }
  if (e.key === 'End')        { stopPlay(); showPhoto(photos.length - 1); }
});

loadPhotos();
</script>
</body>
</html>
